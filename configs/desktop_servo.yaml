# Desktop servo prototype rig (design document, section 1):
# base/platform/horn/rod 76/60/40/130 mm, rest height 120.28 mm.
# Angles in degrees; beta is the servo horn plane orientation per leg.
# The full-size rig (fullscale_svp.yaml) swaps this file, not the code.
geometry:
  base_radius_mm: 76.0
  platform_radius_mm: 60.0
  horn_length_mm: 40.0
  rod_length_mm: 130.0
  base_angles_deg: [-50, -70, -170, -190, -290, -310]
  platform_angles_deg: [-54, -66, -174, -186, -294, -306]
  beta_deg: [30, -150, -90, 90, 150, -30]
  initial_height_mm: 120.28183632

# Washout cueing: starting points for the desktop rig, retune on hardware.
# Sign convention: +X forward, +Y left, +Z up; forward accel pitches nose up.
# If a direction feels inverted on the rig, flip the tilt_*_gain sign here.
washout:
  dt_s: 0.005
  accel_gain: [0.4, 0.4, 0.5]
  trans_hp_hz: 0.3
  trans_zeta: 1.0
  rot_hp_hz: 1.0
  rot_zeta: 1.0
  tilt_lp_hz: 0.15
  tilt_zeta: 1.0
  tilt_rate_limit_deg_s: 8.0
  tilt_roll_gain: 1.0
  tilt_pitch_gain: 1.0
# Limits sit inside the IK workspace corner: simultaneous saturation
# of every axis stays reachable, so the servo path never has to skip.
  max_translation_mm: [30.0, 30.0, 22.0]
  max_rotation_deg: [15.0, 15.0, 18.0]

# STS3215 servo bus calibration: IK horn angles -> encoder counts.
# 12-bit encoder, 4096 counts over 360 deg of shaft; invert flips the
# per-axis mounting direction. Neutral IK (alpha = 0) sits at center.
servos:
  center_count: 2048
  center_alpha_deg: 0.0
  counts_per_degree: 11.3778
  invert: [false, false, false, false, false, false]
