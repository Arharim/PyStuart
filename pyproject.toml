[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pystuart"
version = "2.0.0.dev0"
description = "Stewart Platform (Hexapod) Simulation and Control"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
    "PyQt6>=6.4.0",
    "PyOpenGL>=3.1.5",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
]
authors = [
    {name = "Arharim", email = "Arharim@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
build = [
    "pyinstaller>=5.0",
]

[project.scripts]
stewart-platform = "pystuart.apps.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pystuart*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
